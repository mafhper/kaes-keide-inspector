name: Release Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Resolve release version
        id: version
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          tag="$INPUT_TAG"
          version="${tag#v}"

          if [[ "$tag" != v* || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag"
            echo "Expected format: vX.Y.Z or vX.Y.Z[-prerelease][+build]"
            exit 1
          fi

          core_version="${version%%[-+]*}"

          package_version="$(node -p "require('./package.json').version")"
          manifest_version="$(node -p "require('./manifest.json').version")"

          if [[ "$package_version" != "$core_version" ]]; then
            echo "package.json version ($package_version) does not match tag core version ($core_version)"
            exit 1
          fi

          if [[ "$manifest_version" != "$core_version" ]]; then
            echo "manifest.json version ($manifest_version) does not match tag core version ($core_version)"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Prepare release archive
        id: archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          source_zip="kaes-keid-inspector.zip"
          release_zip="kaes-keide-inspector-v${VERSION}.zip"

          test -f "$source_zip"
          mv "$source_zip" "$release_zip"
          unzip -t "$release_zip"

          echo "release_zip=$release_zip" >> "$GITHUB_OUTPUT"

      - name: Determine release image
        id: image
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          image_path="docs/images/releases/release.webp"
          image_url="https://raw.githubusercontent.com/${REPOSITORY}/${TAG}/${image_path}"

          test -f "$image_path"
          test -s "$image_path"
          echo "release.webp exists and is not empty"

          current_core="${VERSION%%[-+]*}"
          current_major_minor="${current_core%.*}"

          prev_tag="$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | grep -Fxv "$TAG" | head -n 1 || true)"

          if [[ -z "$prev_tag" ]]; then
            echo "No previous release tag found; accepting current release image"
          else
            prev_core="${prev_tag#v}"
            prev_core="${prev_core%%[-+]*}"
            prev_major_minor="${prev_core%.*}"

            echo "Current release: $TAG ($current_major_minor)"
            echo "Previous release: $prev_tag ($prev_major_minor)"

            if [[ "$current_major_minor" != "$prev_major_minor" ]]; then
              echo "New major.minor line detected: $prev_major_minor -> $current_major_minor"
              if git diff --quiet "$prev_tag".."$TAG" -- "$image_path"; then
                echo "::error::release.webp was not updated for the new major.minor line. Replace docs/images/releases/release.webp before releasing."
                exit 1
              fi
              echo "release.webp was updated for the new line"
            else
              echo "Same major.minor line; reusing the image (patch release)"
            fi
          fi

          echo "image_url=$image_url" >> "$GITHUB_OUTPUT"

      - name: Build release body
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          IMAGE_URL: ${{ steps.image.outputs.image_url }}
        run: |
          set -euo pipefail

          notes_file=".github/release-notes/${TAG}.md"

          generated="$(gh api --method POST "repos/${REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="main" \
            --jq '.body')"

          {
            echo "<p align=\"center\"><img src=\"${IMAGE_URL}\" width=\"960\" alt=\"Kaes Keid Inspector\"></p>"
            echo
            echo "Kaes Keid Inspector ${VERSION} - a CSS/HTML inspector that turns any website into an open book, right in your browser."
            echo
            echo "## What's new in this version"
            if [[ -f "$notes_file" ]]; then
              cat "$notes_file"
            else
              echo "No specific notes were added for this version."
            fi
            echo
            echo "## Installation"
            echo
            echo "1. Download **kaes-keide-inspector-v${VERSION}.zip** from the assets of this Release."
            echo "2. Extract the archive into a local folder."
            echo "3. Open \`chrome://extensions/\` or \`edge://extensions/\`."
            echo "4. Enable **Developer mode**."
            echo "5. Click **Load unpacked** and select the extracted folder."
            echo
            echo "<details>"
            echo "<summary>Other installation details</summary>"
            echo
            echo "The published archive contains the compiled content of \`dist/\` directly. No Node.js, Bun, or local build step is required."
            echo
            echo "</details>"
            echo
            echo "---"
            echo
            echo "<details>"
            echo "<summary>List of changes (generated automatically)</summary>"
            echo
            echo "$generated"
            echo
            echo "</details>"
          } > release-body.md

      - name: Create GitHub Release and upload archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_ZIP: ${{ steps.archive.outputs.release_zip }}
        run: |
          set -euo pipefail

          prerelease=""
          if [[ "$VERSION" == *-* ]]; then
            prerelease="--prerelease"
          fi

          gh release create "$TAG" \
            "$RELEASE_ZIP" \
            --title "Kaes Keid Inspector v${VERSION}" \
            --notes-file release-body.md \
            --target main \
            $prerelease